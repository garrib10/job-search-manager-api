name: Labeler

# WHY:
# pull_request_target is needed so the token can add labels to pull requests,
# including Dependabot's. It runs the workflow and .github/labeler.yml from the
# base branch, and this job never checks out or runs pull request code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: ["main", "develop"]

permissions: {}

jobs:
  labeler:
    name: labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
